<h1>Tibia 7.4/ Tibiantis notes</h1>
<p><i>by Tarsal.</i></p>
<hr>
<h1>Food and Regeneration</h1>
 
<p class="note">Regen = Nutrition &times; 12 seconds. Weight in oz. Cost, Purchase Locations, and Dropped By are blank (not in source file).</p>

<div class="controls">
  <label for="sortField">Sort by:</label><br>
  <select id="sortField">
    <option value="name">Name</option>
    <option value="regen">Regen</option>
    <option value="fillPct">Fill %</option>
    <option value="weight">Weight</option>
    <option value="regenPerWeight">Regen / Weight</option>
    <option value="stackable">Stackable</option>
  </select>

  <label for="sortDir">Order:</label><br>
  <select id="sortDir">
    <option value="asc">Ascending</option>
    <option value="desc">Descending</option>
  </select>
</div>

<table id="foodTable">
<thead>
<tr>
  <th>Name</th>
  <th>Regen (s)</th>
  <th>Fill %</th>
  <th>Cost</th>
  <th>Weight (oz)</th>
  <th>Regen / Weight</th>
  <th>Regen / Cost</th>
  <th>Purchase Locations</th>
  <th>Stackable</th>
  <th>Dropped By</th>
</tr>
</thead>
<tbody></tbody>
</table>

<script>
const data = [
{"name":"Banana","regen":96,"weight":1.8,"stackable":true},
{"name":"Blueberry","regen":12,"weight":0.2,"stackable":true},
{"name":"Bread","regen":120,"weight":5.0,"stackable":true},
{"name":"Brown bread","regen":96,"weight":4.0,"stackable":true},
{"name":"Brown mushroom","regen":264,"weight":0.2,"stackable":true},
{"name":"Candy cane","regen":24,"weight":0.5,"stackable":true},
{"name":"Carrot","regen":96,"weight":1.6,"stackable":true},
{"name":"Cherry","regen":12,"weight":0.2,"stackable":true},
{"name":"Coconut","regen":216,"weight":4.8,"stackable":true},
{"name":"Cookie","regen":24,"weight":0.1,"stackable":true},
{"name":"Corncob","regen":108,"weight":3.5,"stackable":true},
{"name":"Dark mushroom","regen":72,"weight":0.1,"stackable":true},
{"name":"Fire mushroom","regen":432,"weight":0.1,"stackable":true},
{"name":"Fish","regen":144,"weight":5.2,"stackable":true},
{"name":"Green mushroom","regen":60,"weight":0.1,"stackable":true},
{"name":"Melon","regen":240,"weight":9.5,"stackable":false},
{"name":"Northern pike","regen":204,"weight":8.3,"stackable":true},
{"name":"Pear","regen":60,"weight":1.4,"stackable":true},
{"name":"Pumpkin","regen":204,"weight":13.5,"stackable":false},
{"name":"Red apple","regen":72,"weight":1.5,"stackable":true},
{"name":"Red mushroom","regen":48,"weight":0.5,"stackable":true},
{"name":"Roll","regen":36,"weight":1.0,"stackable":true},
{"name":"Strawberry","regen":24,"weight":0.2,"stackable":true},
{"name":"Tomato","regen":72,"weight":1.0,"stackable":true},
{"name":"White mushroom","regen":108,"weight":0.4,"stackable":true},
{"name":"Wood mushroom","regen":108,"weight":0.3,"stackable":true},
{"name":"Ggg","regen":72,"weight":0.3,"stackable":true},
{"name":"Orange","regen":156,"weight":1.1,"stackable":true},
{"name":"Orange mushroom","regen":360,"weight":0.3,"stackable":true},
{"name":"Cheese","regen":108,"weight":4.0,"stackable":false},
{"name":"Dragon ham","regen":720,"weight":30.0,"stackable":true},
{"name":"Grapes","regen":108,"weight":2.5,"stackable":false},
{"name":"Ham","regen":360,"weight":20.0,"stackable":true},
{"name":"Meat","regen":180,"weight":13.0,"stackable":true},
{"name":"Salmon","regen":120,"weight":3.2,"stackable":true},
{"name":"Shrimp","regen":48,"weight":0.5,"stackable":true},
{"name":"Some mushrooms","regen":144,"weight":0.1,"stackable":true},
{"name":"Some mushrooms","regen":36,"weight":0.1,"stackable":true},
];

data.forEach(d => {
  d.regenPerWeight = +(d.regen / d.weight).toFixed(1);
  d.fillPct = d.regen / 12;
});

const tbody = document.querySelector('#foodTable tbody');

function render(rows) {
  tbody.innerHTML = '';
  rows.forEach(r => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${r.name}</td>
      <td class="num">${r.regen}</td>
      <td class="num">${r.fillPct}%</td>
      <td></td>
      <td class="num">${r.weight.toFixed(1)}</td>
      <td class="num">${r.regenPerWeight}</td>
      <td></td>
      <td></td>
      <td>${r.stackable ? 'Yes' : 'No'}</td>
      <td></td>
    `;
    tbody.appendChild(tr);
  });
}

function sortAndRender() {
  const field = document.getElementById('sortField').value;
  const dir = document.getElementById('sortDir').value === 'asc' ? 1 : -1;
  const sorted = [...data].sort((a, b) => {
    let av = a[field], bv = b[field];
    if (typeof av === 'string') return dir * av.localeCompare(bv);
    if (typeof av === 'boolean') av = av ? 1 : 0, bv = bv ? 1 : 0;
    return dir * (av - bv);
  });
  render(sorted);
}

document.getElementById('sortField').addEventListener('change', sortAndRender);
document.getElementById('sortDir').addEventListener('change', sortAndRender);

sortAndRender();
</script>

</body>
</html>
